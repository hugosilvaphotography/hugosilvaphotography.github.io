<section class="contacto">
  <form action="https://submit-form.com/XGLJND8S7">
    <h1 class="form-title">Entre em contacto</h1>
    <p class="form-subtitle">Porto, Portugal</p>

    <input type="hidden" name="_redirect" value="https://hugosilvaphotography.github.io/obrigado" />

    <label for="nome"><b>Nome <span style="color: red;">*</span></b></label>
    <input type="text" id="nome" name="nome" required />

    <label for="email"><b>Email <span style="color: red;">*</span></b></label>
    <input type="email" id="email" name="email" required />

    <label for="tipo"><b>Tipo de Sessão/Evento <span style="color: red;">*</span></b></label>

    <div class="radio-group">
      <label class="radio-item"><input type="radio" name="tipo" id="Grávida" value="Grávida" required>Grávida</label>
      <label class="radio-item"><input type="radio" name="tipo" id="Bebé" value="Bebé">Bebé</label>
      <label class="radio-item"><input type="radio" name="tipo" id="Batizado" value="Batizado">Batizado</label>
      <label class="radio-item"><input type="radio" name="tipo" id="Comunhão" value="Comunhão">Comunhão</label>
      <label class="radio-item"><input type="radio" name="tipo" id="Gerações" value="Gerações">Gerações</label>
      <label class="radio-item"><input type="radio" name="tipo" id="Casamento" value="Casamento">Casamento</label>
      <label class="radio-item"><input type="radio" name="tipo" id="Natal" value="Natal">Natal</label>
      <label class="radio-item"><input type="radio" name="tipo" id="Outro" value="outro">Outro</label>
    </div>

    <label for="local"><b>Local (cidade, espaço ou morada aproximada) <span style="color: red;">*</span></b></label>
    <input type="text" id="local" name="local" required />

    <label for="data"><b>Data <span style="color: red;">*</span></b></label>
    <input type="date" id="data" name="data" required />

    <label for="como"><b>Como nos conheceu? <span style="color: red;">*</span></b></label>
    <div class="radio-group">
      <label class="radio-item"><input type="radio" name="como" id="Instagram" value="Instagram" required>Instagram</label>
      <label class="radio-item"><input type="radio" name="como" id="Facebook" value="Facebook">Facebook</label>
      <label class="radio-item"><input type="radio" name="como" id="TikTok" value="TikTok">TikTok</label>
      <label class="radio-item"><input type="radio" name="como" id="Casamentos.pt" value="Casamentos.pt">Casamentos.pt</label>
      <label class="radio-item"><input type="radio" name="como" id="Recomendação" value="Recomendação">Recomendação</label>
      <label class="radio-item"><input type="radio" name="como" id="OutroComo" value="outro">Outro</label>
    </div>

    <label for="mensagem"><b>Mensagem <span style="color: red;">*</span></b></label>
    <textarea id="mensagem" name="mensagem" required></textarea>

    <div class="g-recaptcha" data-sitekey="6LeL_NcpAAAAAGvnMjwe2OxhehQcvtkW6oGxO-Wk"></div>

    <button type="submit"><b>Enviar</b></button>
  </form>
</section>
