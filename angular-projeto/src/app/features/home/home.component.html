<section class="home">
  <img class="home-bg" src="/imagens/gerais/fundo_site.webp" alt="" aria-hidden="true" />

  <div class="container">
    <svg viewBox="0 0 2000 600" class="draw-gradient" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f8f4ef"/>
          <stop offset="100%" stop-color="#8b9b82"/>
        </linearGradient>

        <!-- Drop shadow for text -->
        <filter id="text-shadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.60" />
        </filter>
      </defs>

      <text x="50%" y="45%" text-anchor="middle" dominant-baseline="middle" fill="url(#grad1)" filter="url(#text-shadow)">
        <tspan x="50%" dy="0" style="font-family: 'Macondo Swash Caps', cursive">Fotografar é eternizar</tspan>
        <tspan x="50%" dy="1.1em" style="font-family: 'Macondo Swash Caps', cursive">um segundo...</tspan>
      </text>
    </svg>
  </div>
</section>
