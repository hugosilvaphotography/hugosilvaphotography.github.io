<!-- Basic navigation: no background, horizontal list with optional submenu -->
<nav class="nav" aria-label="Primary">
  <ul class="nav-list">
    <li class="nav-item" *ngFor="let item of menu()">
      <!-- If the item has children we don't want the parent click to navigate -->
      <ng-container *ngIf="item.children?.length; else singleLink">
        <a href="#" class="nav-link" (click)="$event.preventDefault()">
          {{ item.labelKey }}
        </a>
      </ng-container>

      <ng-template #singleLink>
        <a [routerLink]="item.route || '/'" class="nav-link" [class.active]="isActive(item.route)">
          {{ item.labelKey }}
        </a>
      </ng-template>
    </li>
  </ul>
</nav>
