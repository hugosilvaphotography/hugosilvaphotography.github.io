name: Deploy Angular Project to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        working-directory: ./angular-projeto
        run: |
          npm install
          npm run build -- --configuration production --base-href "/"
          cp dist/angular-projeto/browser/index.html dist/angular-projeto/browser/404.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: angular-projeto/dist/angular-projeto/browser
          branch: gh-pages